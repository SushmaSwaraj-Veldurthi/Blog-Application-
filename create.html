<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>
</head>
<body>

<h1>Create Blog Post</h1>

<form method="POST">
    <input type="text" name="title"
           placeholder="Enter Title" required>
    <br><br>

    <textarea name="content"
              rows="10"
              cols="50"
              placeholder="Write your blog..."
              required></textarea>

    <br><br>

    <button type="submit">Publish</button>
</form>

</body>
</html>
